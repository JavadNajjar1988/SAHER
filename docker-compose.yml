services:
  saher-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saher-api
    environment:
      SAHER_ENV: production
      SAHER_DB_PATH: /app/data/saher.db
      SAHER_STORAGE_DIR: /app/data/files
      SAHER_OCR_ENGINE: tesseract
      SAHER_OCR_MODEL_DIR: /app/data/models/tessdata
      SAHER_OCR_LANGUAGES: fas+eng
      # Disable embedded API worker when running dedicated standalone worker container
      SAHER_ENABLE_BACKGROUND_WORKER: "false"
      SAHER_WORKER_HEARTBEAT_TTL_SECONDS: "45"
    ports:
      - "8000:8000"
    volumes:
      - saher_data:/app/data
      - ./data/models/tessdata:/app/data/models/tessdata:ro
    networks:
      - saher_offline_net
    restart: unless-stopped

  saher-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saher-worker
    command: ["python", "-m", "services.worker.runner"]
    environment:
      SAHER_ENV: production
      SAHER_DB_PATH: /app/data/saher.db
      SAHER_STORAGE_DIR: /app/data/files
      SAHER_OCR_ENGINE: tesseract
      SAHER_OCR_MODEL_DIR: /app/data/models/tessdata
      SAHER_OCR_LANGUAGES: fas+eng
      SAHER_WORKER_POLL_SECONDS: "0.5"
      SAHER_WORKER_LEASE_SECONDS: "60"
    volumes:
      - saher_data:/app/data
      - ./data/models/tessdata:/app/data/models/tessdata:ro
    networks:
      - saher_offline_net
    depends_on:
      - saher-api
    restart: unless-stopped

networks:
  saher_offline_net:
    driver: bridge
    internal: true

volumes:
  saher_data:
