server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 26m;

    location ~ ^/(api/|health$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://api:8765;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
